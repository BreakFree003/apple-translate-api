name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # 需要 macOS 26+：Translation 框架的 TranslationSession(installedSource:target:)
    # 从 macOS 26 起才有，包本身也声明了 .macOS("26.0")。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: 工具链信息
        run: swift --version && sw_vers

      # 单测放在最前面：干净检出上第一次跑没出过问题。
      # 走 scripts/test.sh 而不是裸 swift test —— 它会给编译器显式指定 swift-testing 的宏
      # 插件目录。起因：只装 CommandLineTools 的机器上，裸 swift test 的增量构建会偶发报
      # `plugin for module 'TestingMacros' not found`（实测连跑 4 次挂 2 次），显式指定后
      # 4/4 通过。CI runner 带完整 Xcode，脚本会自己找对路径。
      - name: 单元测试（只测纯逻辑，不依赖语言包）
        run: ./scripts/test.sh

      - name: 构建
        run: swift build -c release
        env:
          # SwiftPM 默认把 module cache 写到 ~/Library/Caches/org.swift.swiftpm，
          # 那里在 CI 上是跨 run 共享的 —— 指到 workspace 里，各跑各的。
          # （brew 公式里用同样的手法绕开构建 sandbox，跟上面那个插件问题无关。）
          SWIFTPM_MODULECACHE_OVERRIDE: ${{ github.workspace }}/.swiftpm-cache

      - name: CLI 自检
        env:
          SWIFTPM_MODULECACHE_OVERRIDE: ${{ github.workspace }}/.swiftpm-cache
        run: |
          BIN="$(swift build -c release --show-bin-path)/apple-translate-server"
          "$BIN" --version
          "$BIN" --help
          # 端口没被占时服务必须能起来并响应 /health（不碰翻译，不需要语言包）。
          "$BIN" > /tmp/server.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8787/health && break
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8787/health | python3 -m json.tool
          kill %1

      # scripts/e2e.sh 要在 CI 里跑得先装语言包（系统设置里手动装），
      # 所以它不进 CI，只做本地验收。
